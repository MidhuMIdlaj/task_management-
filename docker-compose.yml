version: "3.8"
services:
  mongo:
    image: mongo:7
    container_name: task-management-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: task-management-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/task_management
      JWT_SECRET: super_secret_change_me
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: task-management-frontend
    ports:
      - "5173:4173"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
